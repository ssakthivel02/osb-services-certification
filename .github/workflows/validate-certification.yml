name: Validate Certification Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policies
        run: python scripts/validate_certification_baseline.py
      - name: Run negative safety cases
        run: python scripts/test_certification_safety_cases.py
